<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo cerrado, circular, de evocación facial. Para un observador contemporáneo, la disposición de dos elementos puntiformes, un componente central y una línea inferior horizontal puede sugerir un rostro frontal. Esta lectura describe una semejanza percibida en el presente y no atribuye al grabado una identidad, función o significación originaria.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>La composición se inscribe en un contorno cerrado, subrectangular, con esquinas redondeadas y línea de grosor irregular. En el sector interno superior se dispone una línea horizontal larga, que desde su zona central desciende una línea vertical que termina en una línea transversal corta y redondeada. Dos elementos aislados, uno lineal y otro puntiforme, se ubican en el sector interno inferior. La organización es axial y aproximadamente bilateral, con variaciones menores en el contorno y en la posición de los componentes.</p>
