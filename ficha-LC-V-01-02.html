<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo compuesto, discontinuo y de bajo relieve lineal, de evocación antropomorfa. La unidad superior sugiere, para el observador contemporáneo, una figura humana de frente, con la cabeza redondeada y las extremidades extendidas. La unidad inferior, alineada sobre el mismo eje, puede percibirse como una segunda figura antropomorfa muy esquematizada o como un signo asociado. Estas semejanzas son perceptivas y no implican una identificación del referente ni una atribución de significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición vertical integrada por dos unidades separadas y alineadas a lo largo de un eje central. La unidad superior conserva una línea central alargada, rematada arriba y abajo por lóbulos redondeados. Desde su tercio superior parten dos prolongaciones laterales lineales, ligeramente ascendentes y curvadas en sus extremos; desde el tercio inferior salen otras dos prolongaciones lineales transversales cuyos extremos descienden. La unidad inferior está formada por una línea curva amplia en su parte superior, cóncava hacia arriba, unida en su punto medio a una línea vertical descendente; sobre la concavidad se dispone un elemento puntiforme independiente. Ambas unidades presentan una simetría bilateral aproximada, con diferencias en anchura, longitud y curvatura entre sus lados.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>El motivo presenta surcos tenues de muy bajo contraste, bordes difusos y amplios sectores de lectura difícil sobre una superficie rugosa y meteorizada. La continuidad de varios trazos no puede comprobarse con seguridad a partir de los datos disponibles; por ello, el dibujo debe considerarse un papel de trabajo y contrastarse in situ mediante iluminación rasante no invasiva, sin humedecer ni remarcar el soporte.</p>
