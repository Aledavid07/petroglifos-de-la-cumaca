<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo geométrico compuesto y discontinuo, de evocación podomorfa o zoomorfa (huella felina). La disposición de cinco semiesferas menores sobre otra de mayor tamaño sugiere, para el observador contemporáneo, una impronta animal. La denominación “Huella de Jaguar” se mantiene como nombre convencional y no constituye una determinación zoológica ni una atribución de significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición abierta formada por seis elementos independientes, sin contorno envolvente ni trazos de unión. Cinco componentes subcirculares u ovoides, de dimensiones desiguales, se distribuyen en una hilera arqueada en el sector superior. Debajo de ellos se dispone un círculo considerablemente mayor, de tendencia ovalada y eje principal horizontal. El conjunto presenta orientación horizontal y una organización aproximadamente bilateral, aunque las distancias, los tamaños y los contornos de los elementos superiores son irregulares.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>Las depresiones presentan bordes difusos, escaso contraste y profundidad aparentemente desigual, compatibles con un desgaste superficial avanzado. La individualización de algunos límites en las oquedades debe verificarse mediante observación directa y condiciones de iluminación controladas.</p>
