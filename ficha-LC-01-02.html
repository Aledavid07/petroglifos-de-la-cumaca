<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo compuesto, curvilíneo y geométrico, de evocación antropomorfa. Para un observador contemporáneo, el sector superior ensanchado, con unidades internas dispuestas como rasgos faciales, puede sugerir una cabeza frontal; el estrechamiento y los dos ramales descendentes, un cuerpo alargado con extremidades. Los breves apéndices superiores pueden recordar antenas o prolongaciones cefálicas. Se trata de una analogía perceptiva actual que no atribuye identidad, función ni significado originario al diseño.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>La composición se desarrolla sobre un eje vertical y combina trazos cerrados y abiertos. El contorno principal conforma un sector superior ancho, de tendencia ovoide, que se estrecha en la zona media y continúa hacia abajo en dos ramales lineales paralelos. Del borde superior parten dos apéndices cortos: uno oblicuo hacia la izquierda y otro casi vertical. En el interior del sector superior se agrupan tres unidades anulares con elemento central: dos ovoides abiertas con punto central, yuxtapuestas horizontalmente, unidas por una línea vertical a una circular con punto central situada debajo, sobre el eje. Entre esta última y el estrechamiento quedan dos pequeños espacios ovalados. El ramal izquierdo desciende casi vertical, es cruzado cerca de su extremo por un segmento transversal y termina en dos círculos concéntricos con punto central; el derecho se arquea hacia fuera y concluye en una espiral simple. La parte superior presenta una simetría aproximada, mientras las terminaciones inferiores son marcadamente asimétricas.</p>
