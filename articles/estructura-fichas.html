      <h1>Estructura de la Ficha Descriptiva</h1>

      <div class="box">
        <p class="hes-intro-paragraph" style="margin-bottom: 0;"><em>Blog de las estaciones del sitio con arte rupestre La Cumaquita</em></p>
      </div>

      <div class="text-content">

        <h2>Estructura propuesta</h2>
        <div class="separator"></div>

        <ol class="hes-list">
          <li><strong>Imagen del motivo rupestre in situ</strong><br>Fotografía legible del motivo sobre su soporte rocoso. El pie debe consignar, como mínimo, nombre y apellido de quien tomó la imagen y, cuando se conozca, el año del registro.</li>
          <li><strong>Dibujo en negativo del diseño</strong><br>Representación gráfica en la que el trazado se distingue claramente del fondo. Debe acreditar la autoría del dibujo base y, si corresponde, la del tratamiento gráfico o vectorización.</li>
          <li><strong>Clasificación por evocación contemporánea</strong><br>Categoría breve que indique qué puede sugerir la figura a un observador actual, por ejemplo: antropomorfa, zoomorfa, fitomorfa, geométrica, indeterminada o compuesta. La redacción debe explicitar que se trata de una semejanza perceptiva actual, no de la identificación de su sentido original.</li>
          <li><strong>Descripción formal de la composición</strong><br>Exposición de los rasgos observables: orientación, organización, número y tipo de elementos, relaciones espaciales, simetría o asimetría, líneas, círculos, puntos, espirales y terminaciones. No debe incorporar nombres anatómicos ni interpretaciones culturales salvo que se indiquen como hipótesis.</li>
          <li><strong>Campos complementarios recomendados</strong><br>Código de ficha, estación, soporte, dimensiones, nombre convencional o popular (con fuente), fecha del registro y observaciones de conservación.</li>
        </ol>

      </div>
