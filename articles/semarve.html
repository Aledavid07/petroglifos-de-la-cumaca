        <h2>Fines de la Sociedad</h2>
        <div class="separator"></div>

        <p>La Sociedad tendrá los siguientes fines:</p>

        <ol class="hes-list">
          <li>Crear una publicación científica y humanística, en la cual se recojan las diferentes investigaciones en la disciplina del Arte Rupestre.</li>
          <li>Realizar ediciones y publicaciones impresas y/o electrónicas generales, tales como dípticos, trípticos, folletos y otros, que contribuyan a la difusión del conocimiento de las manifestaciones rupestres venezolanas.</li>
          <li>Establecer y mantener relaciones con el Instituto del Patrimonio Cultural y otros entes institucionales públicos o privados, nacionales o internacionales y colaborar en la elaboración de políticas, planes y proyectos relacionados con las manifestaciones rupestres venezolanas.</li>
          <li>Realizar actividades técnicas, artísticas y científicas relacionadas con las manifestaciones rupestres.</li>
          <li>Organizar cursos, foros, conferencias, seminarios, simposios, congresos y otras actividades destinadas a la difusión del conocimiento de las manifestaciones rupestres.</li>
          <li>Crear espacios de encuentro para el intercambio y confrontación de experiencias investigativas, procurando la unificación de criterios relacionados con los métodos de registro e inventario del material rupestre.</li>
          <li>Incentivar la participación de los miembros en actividades de capacitación y mejoramiento profesional, tales como talleres, cursos, seminarios, simposios, entre otros, nacionales e internacionales, que permitan el enriquecimiento en el manejo de nuevas técnicas, metodologías, registros, propuestas, hallazgos y otros aspectos concernientes a las manifestaciones rupestres.</li>
          <li>Colaborar con las investigaciones relacionadas con las manifestaciones rupestres llevadas a cabo por los miembros y otros investigadores independientes de la sociedad.</li>
          <li>Crear una página en la red mundial donde se difundan las investigaciones y demás informaciones relacionadas con esta Sociedad.</li>
          <li>Contribuir con la elaboración de propuestas de conformación de parques arqueológicos y otras modalidades de gestión en los sitios con manifestaciones rupestres o cualquier otra actividad conexa, con el fin de que contribuya a cumplir los objetivos y fines de esta Sociedad.</li>
        </ol>
