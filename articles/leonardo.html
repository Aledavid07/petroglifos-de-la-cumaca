      <div class="separator"></div>
      <p>Experiencia en diseño y ejecución de proyectos transdisciplinarios de investigación en arte rupestre. Manejo de enfoque histórico, arqueológico, etnológico y patrimonial. Habituado a prácticas de campo y laboratorio, investigación documental y redacción de trabajos científicos.</p>
