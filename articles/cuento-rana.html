      <h2 class="text-light-color">Publicaciones</h2>
      <h1>El Canto del Hombre Rana</h1>

      <div class="text-content">

        <h2>I. El Silencio del Agua</h2>
        <div class="separator"></div>

        <p>Mucho antes de que el sol trepara al cielo y los hombres caminaran erguidos, la Tierra dormía en un abrazo de agua y sombra, desde el fondo de la laguna madre, allí donde la luz no alcanza, nació él: el Hombre Rana.</p>
        <p>No tenía nombre, porque aún no existían las palabras.</p>
        <p>Emergió del agua con la piel sembrada de estrellas, con branquias para recordar el origen y pulmones para cantar el porvenir. Los ancestros lo vieron salir entre la niebla y supieron que traía un mensaje: la vida estaba por comenzar.</p>

        <h2>II. Los Hijos del Barro</h2>
        <div class="separator"></div>

        <p>El Hombre Rana caminó por la tierra virgen dejando huellas húmedas que se convertían en ríos. Con su canto, enseñó a los hombres a sembrar el maíz, a llamar la lluvia y a escuchar el susurro de los árboles.</p>
        <p>Entre los humanos, hubo dos hermanos: Mairu y Ocuare, uno era curioso, el otro sabio. Fueron los primeros en acercarse sin miedo al Hombre Rana y escuchar sus enseñanzas. Bajo la Ceiba grande, el hombre rana les confió los secretos del fuego, las plantas y el equilibrio.</p>
        <p>Pero no todo era armonía.</p>

        <h2>III. La Ruptura</h2>
        <div class="separator"></div>

        <p>Un día, Mairu quiso aprender el canto del Hombre Rana para usarlo en su propio beneficio. Lo entonó sin respeto, y su voz quebró el silencio como una piedra sobre el agua. El cielo se oscureció, las ranas se escondieron, el río se secó.</p>
        <p>El Hombre Rana se retiró en silencio, dolido, y desapareció entre las piedras.</p>
        <p>Los sabios lo buscaron, pero sólo hallaron su figura tallada en un gran petroglifo a la orilla del río. Desde entonces, los pueblos supieron que el canto no era suyo, que no podía ser tomado sin alma limpia.</p>

        <h2>IV. El Regreso</h2>
        <div class="separator"></div>

        <p>Pasaron generaciones, el mundo cambió, las ciudades crecieron donde antes cantaban los sapos. Pero un día, una niña llamada Yaku, descendiente de Ocuare, encontró el petroglifo del Hombre Rana cubierto de liquen.</p>
        <p>Lo tocó con respeto, como si saludara a un abuelo dormido. Esa noche, soñó con una voz profunda que le enseñaba un canto antiguo.</p>
        <p>Al despertar, la lluvia regresó tras una larga sequía. Las ranas croaron nuevamente, el pueblo danzó bajo el agua. Y algunos juran haber visto una figura anfibia observando desde el río, con ojos brillantes y corazón de barro.</p>
        <p>Desde entonces, cada vez que un niño canta junto al río, el Hombre Rana escucha, porque mientras alguien recuerde su historia, él sigue habitando los ecos del agua.</p>

        <p style="text-align: center; font-style: italic; color: #4a3822; margin: 40px 0 56px;">
          Autora: Luz Milagro Royett Paz<br>2025
        </p>

              <h1>LUZ MILAGRO ROYETT PAZ</h1>
              <p class="hes-intro-paragraph">Nacida en la calidez de las tierras zulianas, es carabobeña de alma y corazón, habiendo echado raíces profundas en San Diego.</p>
              <p class="hes-intro-paragraph">Poeta y promotora cultural por vocación, teje su vida comunitaria a través de la participación activa en las manifestaciones tradicionales del municipio.</p>
              <p class="hes-intro-paragraph">De espíritu autodidacta, ha nutrido y perfeccionado su voz literaria a través de una constante participación en diversos talleres de creatividad organizados por destacadas instituciones, casas de letras y los centros culturales más emblemáticos de la localidad carabobeña.</p>
              <p class="hes-intro-paragraph">Asimismo, su compromiso con el patrimonio la llevó a certificarse en la I Cohorte del Curso Avanzado Investigación y Conservación Preventiva del Arte Rupestre. En este espacio de salvaguarda ancestral, desarrolló una profunda investigación sobre la “Cosmogonía de la Piedra de la Rana”, plasmando la mística de este importante tema en una serie de cuentos de su autoría.</p>
              <p class="hes-intro-paragraph">Fiel creyente de que sólo bastan un lápiz y un papel para que las letras fluyan, se define a sí misma como una eterna poeta en formación. Para ella, la poesía no es un destino, sino un tránsito permanente; un espacio de resistencia y hermandad donde la palabra compartida se convierte en un puente entre pueblos.</p>
              <p class="hes-intro-paragraph" style="margin-bottom: 0;">Hoy, con la misma frescura de sus primeros versos, continúa habitando las letras como un refugio vital, consagrando su voz, sus relatos y su labor a la memoria colectiva y al florecimiento cultural de su región.</p>
