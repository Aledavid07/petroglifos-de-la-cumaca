        <h2 class="text-light-color">Curso Avanzado</h2>
        <h1>Investigación y Conservación Preventiva del Arte Rupestre</h1>

      <div class="box">

          <p class="hes-intro-paragraph">El <strong>Curso Avanzado de Investigación y Conservación Preventiva del Arte Rupestre</strong> tiene el objetivo de fomentar la capacitación del talento humano en el estudio y la conservación preventiva del Arte Rupestre en Venezuela, desde el enfoque académico, pero pensando en la participación de las comunidades.</p>
          <p class="hes-intro-paragraph">A través de una alianza estratégica entre el Espacio San Diego, de la Dirección Central de Extensión y Servicios a la Comunidad de la Universidad de Carabobo, y la Sociedad para el Estudio de las Manifestaciones Rupestres de Venezuela (SEMARVE), el curso ha propiciado el desarrollo teórico y práctico de la investigación interdisciplinaria, con sentido de participación y gestión social de la preservación del Arte Rupestre.</p>

        </div>

      <div class="text-content">

        <p>Coordinado por el Prof. Omar Ydler, la abogada Isabel Arellana y la Licda. Fanny Barrios, tiene una duración de 80 horas académicas, alternando clases presenciales con visitas a los diferentes yacimientos arqueológicos del estado Carabobo.</p>
