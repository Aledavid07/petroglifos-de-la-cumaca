        <h2 class="text-light-color">Historia</h2>
        <h1>Espacio San Diego</h1>

      <div style="display: flex; justify-content: center;">
        <img src="images/desco-banner.png" alt="" style="width: 100%; margin-bottom: 48px; border-radius: 4px;">
      </div>

      <div class="box">
        
          <div class="image-text-flex">
            <img class="hes-img" src="https://blogger.googleusercontent.com/img/a/AVvXsEgFb3JgnaNddSwTAW9ngxfPrTD0QmIGMwTNTHDG8udkx-Eg9Q2RFEmW0NyJvyJCkVuBA76bb0wMn9Awqyux7zUYoBygITR5s4NbvQgw925yQsq7mMPZ2WV9BOD_lR69XzbZmTwqVIHZzR3ZC3Hh8nEkcrgUW0MVeh3ksaP9htGoiBvvtOiWVh_KqDOuVGg=w377-h289" alt="Espacio San Diego">
            <div>
              <p class="hes-intro-paragraph">El Espacio San Diego fue inaugurado el 25 de enero de 2013, como resultado de un convenio entre la Alcaldía del Municipio Autónomo San Diego y la Universidad de Carabobo, a través de sus respectivas autoridades, el alcalde Vicencio Scarano Spisso, y la rectora Jessy Divo de Romero.</p>
              <p class="hes-intro-paragraph" >El objetivo central de este convenio macro es brindar servicios y capacitación a la comunidad sandiegana mediante diversas actividades dirigidas a su bienestar sociocultural, ya que el Espacio San Diego forma parte de red Universidad – Comunidad, que coordina la Dirección Central de Extensión y Servicios a la Comunidad de la Universidad de Carabobo.</p>
            </div>
          </div>
          
        </div>
      
      <div class="text-content">


        <p>Esta red busca articular el servicio comunitario, los proyectos de extensión y la participación de la comunidad organizada para la búsqueda de soluciones a sus problemas prioritarios, contribuyendo así al desarrollo de capital social, en el cumplimiento de la Responsabilidad Social de la Universidad de Carabobo. Convenio que ha sido renovado por el alcalde León Jurado y la rectora Jessy Divo de Romero.</p>

        <p>La labor que realiza este espacio universitario, coordinado desde su creación por la Lic. Fanny Barrios, está enfocada en la capacitación de los integrantes de las comunidades adyacentes a la sede, a través de cursos y talleres. El primer programa que se ejecutó fue el <em>“Fortalecimiento en la capacitación comunitaria integral”</em>, aprobado por el Consejo General de Extensión. Este programa estuvo constituido por cuatro proyectos:</p>

        <ol class="hes-list">
          <li>Fomento de técnicas de estudios para el desarrollo de habilidades y destrezas académicas dirigidos a niños, niñas y adolescentes.</li>
          <li>Fortalecimiento de la convivencia comunitaria como un modo de vida, dirigido a las comunidades adyacentes del Espacio San Diego.</li>
          <li>Fomento y Promoción de actividades culturales que desarrollen el apego a nuestras tradiciones, dirigido a niños, niñas y adolescentes de las comunidades adyacentes al Espacio San Diego; y</li>
          <li>Capacitación en el área de Artes y Oficios para mujeres emprendedoras.</li>
        </ol>

        <h2>Áreas de acción</h2>
        <div class="separator"></div>

        <p>Actualmente las actividades del Espacio están enmarcadas en el Programa Desarrollo integral de las comunidades desde los Espacios de la Red Universidad Comunidad de la DCESCO, que abarca las siguientes áreas:</p>

        <ul class="hes-list">
          <li><strong>Capacitación académica.</strong> Desarrolla talleres y cursos de apoyo académico para niñas, niños y adolescentes. Curso Avanzado en Investigación y Conservación Preventiva Del Arte Rupestre. Tenemos clases de inglés para niños, niñas y jóvenes; elaboración de mapas mentales, mapas conceptuales, uso de la ortografía, letras script o molde; lettering, elaboración de láminas y hemeroteca; tips para exposiciones, orientación para la elaboración de láminas del proyecto de vida, utilidad del subrayado, promoción de la lectura y oratoria, entre otras.</li>
          <li><strong>Capacitación para el trabajo.</strong> Consta de actividades de crochet, bisutería, dulcería, técnica de alambrismo, piñatería, costura básica, franelas decoradas, libretas artesanales, entre otras.</li>
          <li><strong>Ciudadanía.</strong> Liderazgo en el ejercicio de la gerencia social, abordaje social, oratoria y comunicación asertiva; manejo de las emociones; cómo aprender a vivir en el aquí y el ahora; convivencia familiar, conociendo el espectro autista, asesorías jurídicas; el acoso, ansiedad, niña buena, derechos humanos, Ley de Violencia Contra la Mujer, entre otras.</li>
          <li><strong>Cultura.</strong> Taller Almanaque Festivo de Venezuela, Tradiciones de Venezuela: Velorio de Cruz de Mayo, Corpus Christi y Diabladas de Venezuela y Navidad; juguetes tradicionales: muñecas de trapo y muñecas de hilos. Artes plásticas. Talleres de pintura, escultura, técnica de papel maché, falso vitral, dibujo, moldeado de masa de sal, origami, técnica de macramé, filigrana, bonsái con técnica de alambrismo, entre otras.</li>
          <li><strong>Recreación.</strong> Talleres vacacionales y exposiciones periódicas de los trabajos realizados en los diferentes talleres.</li>
        </ul>

        <h2>Actividades permanentes</h2>
        <div class="separator"></div>

        <ol class="hes-list">
          <li>Promoción de la lectura.</li>
          <li>Taller de Origami.</li>
          <li>Talleres de Artes plásticas para niñas y niños.</li>
          <li>Curso de Crochet para mujeres de la tercera edad.</li>
          <li>Curso de Oratoria.</li>
          <li>Curso de Inglés para adolescentes.</li>
          <li>Talleres de manualidades para mujeres emprendedoras.</li>
        </ol>

        <h2>Alianzas estratégicas</h2>
        <div class="separator"></div>

        <p>Con relación a las alianzas estratégicas, el Espacio ha trabajado con grupos comunitarios e instituciones públicas del Municipio San Diego; entre ellas la Alcaldía de San Diego, Sociedad para el Estudio de las Manifestaciones Rupestres de Venezuela, Fundación Dulce Esperanza, Grupo Gestión Ciudadana San Diego, Grupo Cultural Diablitos Danzantes de San Diego de Alcalá; Unión de Bailadores de Burras y Burriquitas del Valle de San Diego, ONG NO a los Malos Tratos y Grupo Comunitario Somos San Diego.</p>
