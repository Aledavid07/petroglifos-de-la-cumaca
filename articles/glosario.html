      <h2 class="text-light-color">Petroglifos de La Cumaca</h2>
      <h1>Glosario de Términos</h1>

      <div class="text-content">

        <ul class="hes-people">
          <li class="hes-person"><span class="hes-name">Antropomorfo(a)</span><span class="hes-role">Describe lo que tiene forma o rasgos corporales semejantes a los de un ser humano. Representación o apariencia humana.</span></li>
          <li class="hes-person"><span class="hes-name">Astromorfo</span><span class="hes-role">Figura o representación que evoca a un cuerpo u objeto astronómico, como el sol, la luna, las estrellas, eclipses, constelaciones, entre otras.</span></li>
          <li class="hes-person"><span class="hes-name">Bifurcar</span><span class="hes-role">Dividir o separar algo en dos ramales, brazos, vías o direcciones.</span></li>
          <li class="hes-person"><span class="hes-name">Círculos concéntricos</span><span class="hes-role">Dos o más círculos que comparten exactamente el mismo centro, pero tienen radios de diferentes longitudes.</span></li>
          <li class="hes-person"><span class="hes-name">Corozo</span><span class="hes-role">Fruta tropical de una palmera de este nombre. En este contexto es una denominación toponímica o de lugar.</span></li>
          <li class="hes-person"><span class="hes-name">Elementos anulares</span><span class="hes-role">Motivos geométricos en forma de anillo (anular) que varían en complejidad (círculos y estructuras concéntricas). Representan uno de los motivos geométricos y abstractos más universales, abundantes y complejos de interpretar.</span></li>
          <li class="hes-person"><span class="hes-name">Elementos ovoides</span><span class="hes-role">Formas elípticas, ovaladas o de huevo. Representan una de las morfologías geométricas y abstractas más comunes del arte rupestre a nivel mundial.</span></li>
          <li class="hes-person"><span class="hes-name">Espiral</span><span class="hes-role">Línea o curva que da indefinidamente vueltas alrededor de un punto, alejándose de él más en cada una de ellas. Pueden ser espirales simples o dobles, cuando el diseño se enrosca hacia adentro desde uno o dos extremos. Ganchos o apéndices curvos, como las líneas que salen de figuras antropomorfas (humanas) o zoomorfas (animales).</span></li>
          <li class="hes-person"><span class="hes-name">Figuras abstractas</span><span class="hes-role">Grabados en la roca que no representan formas realistas o geométricas claras, sino trazos libres, líneas o símbolos cuyo significado original dependía de la cosmovisión de la cultura que los creó.</span></li>
          <li class="hes-person"><span class="hes-name">Figuras geométricas</span><span class="hes-role">Representaciones visuales y abstractas formadas por un conjunto de puntos, líneas o superficies cerradas en un plano o en el espacio.</span></li>
          <li class="hes-person"><span class="hes-name">Oquedades (oquedad)</span><span class="hes-role">Pequeñas depresiones o huecos artificiales, semicirculares, excavados por percusión, fricción o abrasión sobre la superficie de las rocas.</span></li>
          <li class="hes-person"><span class="hes-name">Ovoide</span><span class="hes-role">Que tiene forma de huevo.</span></li>
          <li class="hes-person"><span class="hes-name">Podomorfo</span><span class="hes-role">(Grabado podomorfo) Forma de arte rupestre que consiste en siluetas de pies humanos talladas directamente sobre la roca. El término proviene del griego <em>podós</em> (pie) y <em>morphé</em> (forma).</span></li>
          <li class="hes-person"><span class="hes-name">Puntiforme</span><span class="hes-role">Se refiere a la forma, diseño o técnica basada en puntos individuales o agrupados.</span></li>
          <li class="hes-person"><span class="hes-name">Superficie meteorizada</span><span class="hes-role">Aquella capa externa de rocas o minerales que ha sufrido desgaste, descomposición o fragmentación debido a cambios bruscos de temperatura, cambios químicos producto de reacciones con el agua y el aire, y la actividad metabólica de microorganismos.</span></li>
          <li class="hes-person"><span class="hes-name">“T” amazónica</span><span class="hes-role">Rasgo estilístico característico del arte rupestre sudamericano, utilizado para delinear las cejas y la nariz en una sola línea continua con forma de “T” (ya sea recta o en forma de ancla) en los rostros y máscaras de los petroglifos.</span></li>
          <li class="hes-person"><span class="hes-name">Técnica de percusión</span><span class="hes-role">Consiste en golpear la superficie de una roca para remover su capa externa creando los surcos y depresiones que conforman un diseño.</span></li>
          <li class="hes-person"><span class="hes-name">Voluta</span><span class="hes-role">Figura en forma de espiral o curva en enrollamiento.</span></li>
          <li class="hes-person"><span class="hes-name">Zoomorfo</span><span class="hes-role">Adjetivo que describe cualquier objeto, figura, escultura u obra de arte que tiene forma, apariencia o rasgos animales.</span></li>
        </ul>
