<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo antropomorfo, de evocación facial. En la orientación adoptada por el registro, la disposición aproximadamente bilateral de los elementos internos sugiere, para el observador contemporáneo, un rostro visto de frente. Esta semejanza es exclusivamente perceptiva y no implica la identificación de su referente ni de su significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición inscrita en un contorno exterior continuo, de tendencia ovalada y eje mayor horizontal. En el interior se disponen los elementos de un rostro (ojos, nariz, boca, cejas) con pintura facial. La boca se dispone como una horadación oval, mientras que nariz y cejas están unidas y cierran por tres de sus costados a dos semiesferas que fungen de ojos. La pintura facial en mejillas se organiza mediante dos círculos. La organización general es de simetría bilateral, aunque presenta irregularidades en el grosor, la curvatura y la separación de los surcos.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>La fotografía registra humedad superficial, colonización biológica y restos cromáticos sobre algunos surcos y sectores adyacentes; los surcos están sin fracturas y con buen espesor y profundidad; su naturaleza, extensión y cronología requieren comprobación directa.</p>
