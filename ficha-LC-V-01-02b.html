<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo de evocación zoomorfa. En la orientación del registro, la zona central y las cuatro prolongaciones laterales sugieren, para el observador contemporáneo, la silueta de un anfibio visto desde arriba, con las extremidades extendidas. La denominación “La Rana” es convencional y no constituye una identificación zoológica ni una atribución de significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición continua, organizada a partir de una zona central socavada, de perfil irregular y orientación aproximadamente diagonal. De ella parten cuatro prolongaciones lineales, curvas y alargadas, dispuestas en dos pares opuestos: las superiores se dirigen hacia el sector superior izquierdo y hacia la derecha, mientras las inferiores se proyectan hacia los sectores inferior izquierdo e inferior derecho. Sus extremos son redondeados y presentan anchura, longitud y curvatura desiguales. El costado derecho de la zona central forma un ensanchamiento redondeado. El conjunto tiende a la simetría bilateral.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>El motivo presenta un estado de conservación delicado. Los surcos son muy tenues, de bordes difusos y con sectores próximos parcialmente borrados por el desgaste superficial, lo que dificulta seguir su continuidad en la fotografía. La delimitación propuesta debe comprobarse in situ mediante iluminación rasante no invasiva, sin humedecer ni remarcar el soporte.</p>
