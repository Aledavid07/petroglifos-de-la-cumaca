<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo geométrico compuesto, curvilíneo y predominantemente concéntrico, que evoca una figura abstracta. La composición no permite compararla con elementos de la naturaleza ni atribuirle un significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición asimétrica organizada alrededor de un núcleo situado en el sector central izquierdo. Este núcleo está formado por un elemento puntiforme rodeado de tres círculos concéntricos. Una línea periférica irregular envuelve casi por completo los tres círculos, incorporando en la parte superior un pequeño engrosamiento puntiforme. Esta línea periférica está unida al círculo concéntrico más externo mediante cinco líneas rectas cortas. Hacia la derecha, parte un apéndice lineal irregular que desciende y se bifurca para unirse a otro apéndice que parte del sector inferior derecho y termina en una voluta orientada hacia el interior. Las líneas presentan diferencias en anchura, curvatura y continuidad.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>El motivo muestra surcos de contraste medio, bordes parcialmente suavizados y una superficie pétrea irregular, de tonalidad y textura variables. El soporte presenta descascarillado, lo que impide confirmar todos los puntos de unión entre las líneas. Se recomienda verificar el motivo directamente mediante iluminación rasante no invasiva, sin humedecer ni remarcar la roca, y completar una evaluación de conservación in situ.</p>
