<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo compuesto, de evocación geométrica y antropomorfa. La pequeña unidad central sugiere al observador contemporáneo la figura humana vista de frente y con los brazos levantados. Esta relación visual explica el nombre popular “La Adoradora”, pero no permite identificar el sexo de la figura, confirmar una acción ritual ni atribuir un significado originario a la composición.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición vertical organizada alrededor de un eje central. En el sector superior se disponen dos líneas circulares concéntricas y un elemento central puntiforme. Presenta una tercera línea exterior concéntrica desde la cual, partiendo de sus sectores laterales inferiores, descienden dos líneas largas y casi paralelas; la de la izquierda termina en una voluta cerrada hacia el interior, mientras la derecha concluye en una voluta incompleta, afectada por una fractura. Entre ambas líneas se ubica una unidad menor con ensanchamientos laterales y base transversal, acompañada en la parte superior por dos líneas curvas ascendentes. En el sector superior sobresalen dos apéndices lineales cortos. El conjunto presenta una simetría bilateral aproximada.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>Los surcos son anchos y profundos, por lo que el diseño presenta una buena legibilidad. Sin embargo, una fractura interrumpe y compromete la voluta inferior derecha. Asimismo, la sección superior del soporte presenta un desprendimiento laminar extendido hacia los bordes izquierdo e inferior, lo que representa un alto riesgo de pérdida de superficie. Esta alteración amerita evaluación e intervención de conservación-restauración por personal especializado, así como la documentación y el seguimiento periódico de su evolución.</p>
