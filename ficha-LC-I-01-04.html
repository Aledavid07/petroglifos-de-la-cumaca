<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo abierto, posiblemente por fractura del soporte, de evocación facial. Para un observador contemporáneo, el gran trazo envolvente, los dos puntos internos, la unidad central en forma de T y la línea horizontal inferior pueden sugerir un rostro frontal con ojos, nariz y boca. La clasificación señala una analogía visual contemporánea y no establece identidad, función ni significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>La composición se organiza mediante un trazo curvo envolvente, de desarrollo subovalado y grosor irregular, semejante a una C abierta —quizá por fractura del soporte— en el cuadrante superior derecho. En su interior aparece, en la parte superior, una línea casi horizontal donde, desde su zona central, desciende una línea vertical de extremo redondeado, con la que forma una unidad semejante a una T. Dos unidades puntiformes, aisladas y sin elementos internos, se ubican a ambos lados de la línea vertical. En el sector inferior se dispone una tercera línea aislada, corta y alargada en sentido horizontal. La composición mantiene un eje vertical y un equilibrio bilateral aproximado, aunque la abertura del contorno y las diferencias entre los componentes introducen asimetría.</p>
