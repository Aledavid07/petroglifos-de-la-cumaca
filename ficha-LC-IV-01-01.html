<h2>CLASIFICACIÓN POR EVOCACIÓN CONTEMPORÁNEA</h2>
<div class="separator"></div>
<p>Motivo de evocación facial antropomorfa. En la orientación del registro, la combinación de un contorno periférico incompleto y varios elementos internos sugiere, para el observador contemporáneo, un rostro visto de frente. Esta lectura perceptiva no identifica al referente representado ni permite atribuirle un significado originario.</p>
<h2>DESCRIPCIÓN FORMAL DE LA COMPOSICIÓN</h2>
<div class="separator"></div>
<p>Composición delimitada parcialmente por una línea cuadrangular de ángulos redondeados que recorre el sector superior y los laterales, se interrumpe por desgaste en la zona inferior y en parte del lateral derecho. Dos líneas curvas separadas completan parte del contorno inferior. En el tercio superior interno se disponen dos elementos ovoides irregulares, socavados y alineados horizontalmente. Desde sus extremos internos descienden dos líneas curvas que conforman un elemento abierto en forma de U. Dentro de este se ubica una pequeña línea horizontal. El conjunto tiende a la simetría bilateral y no presenta una orientación lateral definida.</p>
<h2>OBSERVACIONES DE CONSERVACIÓN</h2>
<div class="separator"></div>
<p>El motivo presenta un desgaste pronunciado y varios sectores del contorno lineal, debilitados o discontinuos. La rugosidad de la roca y el desgaste superficial dificultan la delimitación de los componentes; los segmentos menos nítidos deben comprobarse directamente antes de considerar definitivo el dibujo.</p>
